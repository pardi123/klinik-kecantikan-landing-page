name: Deploy GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile --ignore-scripts
            - run: pnpm build
              env:
                  GITHUB_PAGES: "true"
                  BASE_PATH: /${{ github.event.repository.name }}/
            # Prerender menulis halaman ke build/client/<repo>/; Pages menyajikan build/client
      # di /<repo>/, jadi pindahkan ke root. Fallback SPA jadi 404.html.
      - run: |
          mv build/client/index.html build/client/404.html
          mv build/client/${{ github.event.repository.name }}/index.html build/client/index.html
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: build/client

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
